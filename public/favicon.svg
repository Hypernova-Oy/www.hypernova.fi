<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Hypernova mark for the browser tab, with one rendition per colour scheme so the mark
    stays visible on light and on dark browser chrome. Both renditions are embedded as
    data: URIs, so the choice is made inside this file and no browser can pick the other
    one by accident.

      icon-light  public/favicon.png byte for byte: the 32x32 icon the hypernova.fi
                  production site serves,
                  sha256 9174dedddfc895dcd1fa931c740ac45cd1ee9342cea7ea4642b4fae08864bfa2.
      icon-dark   the white-gradient mark from Hypernova-Oy/media
                  (logo/hypernova-white-gradient-no-text-1024x1024.png), scaled to 64x64
                  so the gradient stays crisp on high-density displays,
                  sha256 5f2bf46316aaca44a243547088fa7ec2374ef60909edb64f4cfb4522ca1482eb.

    Browsers that ignore SVG icons fall back to the /favicon.png and /favicon.ico links in
    src/layouts/BaseLayout.astro, which carry the light rendition.
  -->
  <style>
    .icon-light {
      display: inline;
    }

    .icon-dark {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      .icon-light {
        display: none;
      }

      .icon-dark {
        display: inline;
      }
    }
  </style>
  <image class="icon-light" href="data:image/png;base64," x="0" y="0" width="32" height="32" />
  <image class="icon-dark" href="data:image/png;base64," x="0" y="0" width="32" height="32" />
</svg>
